name: Clean dataset Git history
on:
  push:
    branches: [main]
    paths: ['.github/workflows/clean-history.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: dataset-history-cleanup
  cancel-in-progress: false
jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install git-filter-repo==2.47.0
      - name: Verify release and create full repository backup
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: python scripts/clean_git_history.py backup --work "$RUNNER_TEMP/dataset-cleanup"
      - name: Preserve backup before rewriting
        uses: actions/upload-artifact@v4
        with:
          name: dataset-history-backup
          path: |
            ${{ runner.temp }}/dataset-cleanup/before-cleanup.bundle
            ${{ runner.temp }}/dataset-cleanup/refs-before.json
          retention-days: 7
          compression-level: 0
      - name: Rewrite and atomically push branch and tag history
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: python scripts/clean_git_history.py rewrite --work "$RUNNER_TEMP/dataset-cleanup"
      - name: Preserve reference mapping
        uses: actions/upload-artifact@v4
        with:
          name: dataset-history-ref-mapping
          path: ${{ runner.temp }}/dataset-cleanup/refs-after.txt
          retention-days: 30
