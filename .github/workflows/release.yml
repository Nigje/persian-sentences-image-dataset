name: Verify published dataset release
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install .
      - run: python scripts/download.py
      - run: python scripts/index_dataset.py --archives Dataset --output verified-data
      - run: python scripts/validate_dataset.py
