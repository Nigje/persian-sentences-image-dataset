name: Prepare dataset release
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: tools
      - uses: actions/checkout@v4
        with:
          ref: 0440c1caf7f07c2d01b5f8fbc4bcee23c7f60225
          path: legacy
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install ./tools
      - run: python tools/scripts/index_dataset.py --archives legacy/Dataset --output release-data
      - run: tar -czf metadata-v1.0.0.tar.gz -C release-data .
      - name: Create draft and upload original archives
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view v1.0.0 >/dev/null 2>&1 || gh release create v1.0.0 --draft --target "$GITHUB_SHA" --title "Persian Sentences Image Dataset v1.0.0" --notes-file tools/docs/release-notes.md
          gh release upload v1.0.0 legacy/Dataset/*.zip release-data/SHA256SUMS.txt release-data/metadata.csv release-data/sentences.tsv release-data/audit.json metadata-v1.0.0.tar.gz --clobber
